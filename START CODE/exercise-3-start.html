<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
     body{
        margin: 0;
        padding: 1rem;
        width: 30%;
        height: 50%;
   
    }

    .page{
        display: flex;
        flex-direction: column;
        gap:1rem;

    }

    .header,.footer{
        flex-grow:0 0 3rem;
        padding:1rem;
        border-radius: 0.5rem;
        color: white;
            
    }

    .header{
        background-color:#1e90ff ;
        box-shadow: 0 3px 0 #0077ea;

    } 

    .footer{
        background-color:#4169e1 ;
        box-shadow:0 3px 0 #1d44b8;
        
    } 

    .content{
        display: flex;
        flex-direction: row;
        flex-grow: 1;
        gap: 1rem;
            
    }
        
    .main{
        background-color:#3cb371 ;
        box-shadow: 0 3px 0 #2f8d59;
        border-radius: 0.5rem;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        padding: 1rem;
        border-radius: 0.5rem;

    }

    .main h3{
        margin:0 0 1rem;

    }

    .items{
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap:1rem;
            
    }

    .item{
        background-color:#2f8d59 ;
        box-shadow:0 3px 0 #226741;
        border-radius: 0.5rem;
        flex-grow: 0 0 3.5rem;
        height: 3rem;
        width: 3rem;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .sidebar{
        background-color:#ff6347 ;
        box-shadow: 0 3px 0 #e02200;
        border-radius: 0.5rem;
        flex-grow: 0 0 20%;
        padding: 1rem;
    }   
       
    </style>
</head>
<body>
    <div class="page">
        <header class="header">Header</header>

        <div class="content">
            <main class="main">
                <h3>main</h3>

                <div class="items">
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                </div>
            </main>

            <aside class="sidebar">sidebar</aside>
        </div>
        <footer class="footer">footer</footer>
        
    </div>
    
</body>
</html>

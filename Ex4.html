<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise4</title>
    <style>
        .wrapper{
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .content{
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .big{
            background-color: rgb(108, 174, 10);
            color: white;
            font-size: 30px;
            padding: 10px;
        }
        .small{
            background-color: red;
            color: white;
            font-size: 20px;
            padding: 5px;
            display: none;
        }
        @media only screen and (max-width:600px){
            .big{
                display: none;
            }
            .small{
                display: inline;
            }
        }
        .box-wrapper{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            width: clamp(300px,100%,800px);
            height: 350px;
            background-color: greenyellow;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="content">
            <span class="big">I'm BIG</span>
            <span class="small">I'm SMALL</span>
        </div>
    </div>
    <div class="box-wrapper">
        <div class="box"></div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }
      .pricing-container{
        margin: auto;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: flex-start;
        gap: 15px;
        padding: 20px;
      }

      .pricing-plan{
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
        max-width: 500px;
        min-height: 450px;
       
        background-color: #f5f5f6;
        border-radius: 10px;
      }

      .plan-title{
        font-size: 25px;
        font-weight: bold;
        color: white;
        text-align: center;
        width: 100%;
        padding-bottom: 20px;
        border-radius: 10px 10px 0 0;
        background: linear-gradient(135deg, #cf58cd, #55efc4);
      }

      .plan-price{
        font-size: 28px;
        font-weight: bold;
        margin: 10px;
      }

      .plan-features{
        padding: 0;
        margin: 0;
      }

      .plan-features li{
        margin: 45px;
        font-size: 20px;
      }

      .plan-button{
        padding: 10px 20px;
        background: linear-gradient(135deg, #cf58cd, #55efc4);
        color: white;
        border: none;
        border-radius: 10px;
        
      }

      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container{
          flex-direction: column;
          align-items: center;
        }
        .pricing-plan{
          width: 100%;
          max-width: 400px;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
